<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact – Fernhill Goods</title>
    <link rel="stylesheet" href="site.css">
  </head>
  <body>
    <header class="site-header">
      <a class="skip-link" href="#content">Skip to main content</a>
      <div class="header-bar">
        <a class="logo" href="index.html">Fernhill Goods</a>
        <div class="header-actions">
        <button type="button" class="icon-btn" id="header-search-btn" aria-expanded="false" aria-controls="header-search"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
          <button type="button" id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">Menu</button>
        </div>
      </div>
      <form id="header-search" class="header-search" role="search" action="products.html" method="get" hidden>
        <label for="header-search-q">Search products</label>
        <input id="header-search-q" name="q" type="search">
        <button type="submit" class="btn btn-light">Search</button>
      </form>
      <nav id="primary-nav" class="primary-nav" aria-label="Primary" hidden>
        <ul>
          <li><a href="products.html">Shop all</a></li>
          <li><a href="sale.html">Sale</a></li>
          <li><a href="about.html">About us</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="login.html">Account</a></li>
        </ul>
      </nav>
    </header>
    <main id="content" class="content" tabindex="-1">
      <h1>Contact</h1>
      <p>We answer within one working day.</p>
      <form id="contact-form" class="form" action="#" method="get">
        <div class="field">
          <label for="contact-name">Your name</label>
          <input id="contact-name" name="name" type="text">
        </div>
        <div class="field">
          <span class="field-label">Email address</span>
          <input id="contact-email" name="email" type="email">
        </div>
        <div class="field">
          <label for="contact-topic">Topic</label>
          <select id="contact-topic" name="topic">
            <option>Order question</option>
            <option>Product question</option>
          </select>
        </div>
        <p>This fixture form does not send anything.</p>
      </form>
    </main>
    <footer class="site-footer">
      <nav aria-label="Footer">
        <ul>
          <li><a href="shipping.html">Shipping</a></li>
          <li><a href="returns.html">Returns</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <p>&copy; 2026 Fernhill Goods. Patchwright fixture site.</p>
    </footer>
    <script src="site.js"></script>
  </body>
</html>
